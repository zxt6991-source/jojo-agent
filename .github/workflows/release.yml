name: Release candidates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize using release-signing credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:architecture
      - run: pnpm docs:check
      - run: pnpm test:release
      - run: pnpm test
      - run: xvfb-run -a pnpm test:e2e:electron
      - name: Validate release tag
        run: node scripts/release/version.mjs

  candidate:
    needs: gate
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      JOJO_SIGN_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:conformance
      - run: pnpm test:release
      - name: Import macOS signing certificate into temporary keychain
        if: runner.os == 'macOS' && env.JOJO_SIGN_RELEASE == '1'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"
          test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.JOJO_SIGN_RELEASE == '1'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          if (-not $env:CERTIFICATE) { throw 'Missing Windows signing certificate' }
          $file = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$file" >> $env:GITHUB_ENV
      - name: Install Debian packaging dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Make native distribution
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm --filter @desktop-agent/desktop make --arch=${{ matrix.arch }}
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS' && env.JOJO_SIGN_RELEASE == '1'
        run: |
          set -euo pipefail
          app_path=$(find apps/desktop/out -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - name: Verify Windows executable and installer signatures
        if: runner.os == 'Windows' && env.JOJO_SIGN_RELEASE == '1'
        shell: pwsh
        run: |
          $executables = Get-ChildItem apps/desktop/out -Filter '*.exe' -Recurse
          if (-not $executables) { throw 'No signed executables produced' }
          foreach ($file in $executables) {
            if ((Get-AuthenticodeSignature $file.FullName).Status -ne 'Valid') { throw "Invalid signature: $($file.FullName)" }
          }
      - name: Generate source and lockfile SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build and verify candidate manifest
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node --experimental-strip-types scripts/release/artifacts.mjs prepare apps/desktop/out/make "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/sbom.spdx.json" "$version" "$GITHUB_SHA" "$RELEASE_PLATFORM" "$RELEASE_ARCH"
          node scripts/release/artifacts.mjs verify "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'macOS' ] && [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pfx"
